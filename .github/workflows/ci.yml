name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        python-version:
          - "3.8"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run mypy
        run: |
          mypy src/my_project tests

      - name: Run tests
        run: |
          pytest
